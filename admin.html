<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Socks On Records · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#86AEB9;--paper:#F4F0E6;--ink:#16130F;--red:#C81F28;--card:#FBF9F3;--mute:#4a443b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3,p{margin:0}
.disp{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1;letter-spacing:.01em}
.mono{font-family:'Space Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.top{background:var(--ink);color:var(--paper);border-bottom:5px solid var(--sky);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top a{color:var(--paper);text-decoration:none}
.brand{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:24px;letter-spacing:.02em}
.brand span{color:var(--sky)}
#who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px;border-bottom:3px solid var(--ink)}
.tabs button{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:19px;letter-spacing:.03em;background:none;border:0;padding:10px 18px;min-height:46px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:16px;letter-spacing:.04em;box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn.red{background:var(--red);color:var(--paper)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-color:var(--paper);background:transparent;color:var(--paper)}
.card{background:var(--card);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.row:first-child{border-top:2px solid var(--ink)}
.row .t{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:22px;letter-spacing:.01em}
.row .s{color:var(--mute);font-size:15px}
.row .a{display:flex;gap:8px;flex-wrap:wrap}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:18px}
.f label,.lab{font-family:'Space Mono',monospace;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.f small{color:var(--mute);font-size:14px}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=date],input[type=number],select,textarea{font:inherit;font-size:17px;width:100%;min-height:46px;padding:9px 12px;border:2px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.chk{display:flex;align-items:center;gap:10px;min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--red)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 16px;border:2px solid var(--ink);background:var(--paper);padding:10px 14px;max-height:260px;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sky);border:2px solid var(--ink);padding:2px 4px 2px 10px;font-size:15px;margin:0 6px 6px 0}
.chip button{border:0;background:none;font-size:18px;cursor:pointer;min-width:28px;min-height:28px}
.tag{font-family:'Space Mono',monospace;font-size:12px;text-transform:uppercase;border:2px solid var(--ink);padding:1px 8px;margin-left:8px;vertical-align:middle;background:var(--sky)}
.tag.bad{background:var(--red);color:var(--paper)}
.pre{width:140px;height:140px;object-fit:cover;border:2px solid var(--ink);display:block;margin-bottom:10px;background:var(--paper)}
.note{border-left:6px solid var(--red);background:var(--card);padding:12px 16px;margin-bottom:22px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border:2px solid var(--paper);font-weight:700;max-width:90vw;display:none;z-index:9}
#toast.bad{background:var(--red)}
h2.disp{font-size:34px}
.center{max-width:460px;margin:60px auto}
@media (max-width:640px){.g2{grid-template-columns:1fr}.row .t{font-size:20px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html">Socks On Records <span>Admin</span></a><div id="who"></div></header>
<main class="wrap" id="app"><p class="mono">Loading…</p></main>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://xnbkdgmojfupjerqorcw.supabase.co";
const SUPABASE_KEY="sb_publishable__XrZLQTrqwf9xeLBn5xI7w_vVgFJzCf"; // publishable key: safe in the page, row level security does the guarding
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nul=v=>{v=(v==null?'':String(v)).trim();return v===''?null:v};
const link=v=>{v=nul(v);if(v&&!/^https?:\/\//i.test(v))throw new Error('Links must start with http:// or https://  ('+v+')');return v};
const slugify=s=>String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const ck=r=>{if(r.error)throw r.error;return r.data};
const today=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{if(!s)return '';const p=s.split('-').map(Number);return p[2]+' '+MON[p[1]-1]+' '+p[0]};

let S={user:null,profile:null,admin:false,mine:[],bands:[],gigs:[],releases:[],people:[],shop:null,users:null,members:[],notes:[],settings:null,tab:'bands',edit:null,ready:false};

let tt;
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',bad?7000:2800)}
async function run(fn){try{await fn()}catch(e){console.error(e);toast(e.message||String(e),true)}}

/* ---------- loading ---------- */
async function load(){
  S.profile=ck(await db.from('profiles').select('*').eq('id',S.user.id).maybeSingle());
  S.admin=!!(S.profile&&S.profile.is_admin);
  S.mine=ck(await db.from('band_members').select('band_id').eq('user_id',S.user.id)).map(r=>r.band_id);
  S.bands=ck(await db.from('bands').select('*').order('sort_order').order('name'));
  S.gigs=ck(await db.from('gigs').select('*,gig_acts(position,act_name,band_id,bands(name))').order('event_date',{ascending:false}));
  S.releases=ck(await db.from('releases').select('*,release_bands(band_id)').order('released_date',{ascending:false,nullsFirst:false}).order('title'));
  if(S.admin){
    S.people=ck(await db.from('profiles').select('*').order('email'));
    S.members=ck(await db.from('band_members').select('*'));
    {const ul=await db.rpc('admin_list_users');S.users=(!ul.error&&Array.isArray(ul.data))?ul.data:null}
    S.notes=ck(await db.from('band_notes').select('*'));
    const tryLoad=async q=>{const r=await q;return r.error?null:r.data};
    S.videos=await tryLoad(db.from('videos').select('*,bands(name)').order('sort_order').order('created_at',{ascending:false}));
    S.sessions=await tryLoad(db.from('sessions').select('*,bands(name)').order('session_date',{ascending:false,nullsFirst:false}));
    S.shop=await tryLoad(db.from('shop_items').select('*').order('kind').order('sort_order').order('created_at'));
    S.subs=await tryLoad(db.from('subscribers').select('*').order('created_at',{ascending:false}));
    const st=await db.from('site_settings').select('*').eq('key','featured_release').maybeSingle();
    S.settings=st.error?null:(st.data||{value:{}});   // null = the 03 SQL hasn't been run yet
  }
  S.ready=true;
}
async function reload(){await load();render()}

/* ---------- views ---------- */
function loginView(){
  $('#who').innerHTML='';
  app.innerHTML=`<div class="center card">
  <h2 class="disp" style="margin-bottom:10px">Sign in</h2>
  <p style="margin-bottom:20px">For label admins and bands. Use the email and password you were given.</p>
  <form data-form="pw"><div class="f"><label for="em2">Email</label><input id="em2" name="email" type="email" required autocomplete="email"></div>
  <div class="f"><label for="pw">Password</label><input id="pw" name="password" type="password" required autocomplete="current-password"></div>
  <button class="btn red" type="submit">Sign in</button></form></div>`;
}

function render(){
  if(!S.user){loginView();return}
  $('#who').innerHTML=`<span class="mono">${esc(S.user.email)}${S.admin?'<span class="tag">Admin</span>':''}</span><button class="btn sm ghost" data-act="signout">Sign out</button>`;
  if(!S.ready){app.innerHTML='<p class="mono">Loading…</p>';return}
  if(!S.profile){app.innerHTML=`<div class="card"><h2 class="disp" style="margin-bottom:10px">Something's off</h2><p>You're signed in, but there's no profile for you yet. Ask Roy to check your invite.</p></div>`;return}
  if(!S.admin&&!S.mine.length){app.innerHTML=`<div class="card"><h2 class="disp" style="margin-bottom:10px">You're in</h2><p>You're signed in, but you're not linked to a band yet. Ask Roy to link your login to your band and you'll be able to edit it here.</p></div>${accountView()}`;return}
  const tabs=S.admin?[['bands','Bands'],['gigs','Gigs'],['releases','Releases'],['featured','Featured'],['videos','Videos'],['sessions','Sessions'],['shop','Shop'],['subs','Newsletter'],['people','Users'],['account','Account']]:[['bands',S.mine.length>1?'My bands':'My band'],['gigs','Gigs'],['releases','Releases'],['account','Account']];
  if(!tabs.some(t=>t[0]===S.tab))S.tab='bands';
  const tb=`<div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" class="${S.tab===t[0]?'on':''}" data-act="tab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  let body='';
  if(S.tab==='bands')body=S.edit?bandForm():bandList();
  else if(S.tab==='gigs')body=S.edit?gigForm():gigList();
  else if(S.tab==='releases')body=S.edit?releaseForm():releaseList();
  else if(S.tab==='featured')body=featuredView();
  else if(S.tab==='videos')body=S.edit?videoForm():videosView();
  else if(S.tab==='sessions')body=S.edit?sessionForm():sessionsView();
  else if(S.tab==='shop')body=S.edit?shopForm():shopView();
  else if(S.tab==='subs')body=subsView();
  else if(S.tab==='people')body=peopleView();
  else if(S.tab==='account')body=accountView();
  const vk=S.tab+'|'+(S.edit&&typeof S.edit==='object'?JSON.stringify(S.edit):String(S.edit)),y=window.scrollY,same=vk===S.vk;
  app.innerHTML=tb+body;
  S.vk=vk;window.scrollTo(0,same?y:0);
}
function accountView(){
  const p=S.profile||{};
  return `<div class="bar"><h2 class="disp">Account</h2><button class="btn sm ghost" data-act="signout">Sign out</button></div>
  <form class="card" data-form="profile" style="margin-bottom:24px"><h3 class="disp" style="font-size:24px;margin-bottom:12px">Your details</h3>
  <div class="f"><label>Email (you sign in with this)</label><input value="${esc(S.user.email)}" disabled></div>
  ${F('Your name','display_name',p.display_name,{ph:'Shown to the label admins'})}
  <button class="btn sm" type="submit">Save name</button></form>
  <form class="card" data-form="setpw"><h3 class="disp" style="font-size:24px;margin-bottom:8px">Change your password</h3>
  <p style="margin-bottom:12px;color:var(--mute)">At least 8 characters. You'll stay signed in on this device.</p>
  <div class="g2" style="max-width:700px"><div class="f"><label for="npw">New password</label><input id="npw" name="password" type="password" minlength="8" required autocomplete="new-password"></div>
  <div class="f"><label for="npw2">Type it again</label><input id="npw2" name="password2" type="password" minlength="8" required autocomplete="new-password"></div></div>
  <button class="btn sm red" type="submit">Save password</button></form>`;
}

const F=(label,name,val,o={})=>`<div class="f"><label for="${name}">${label}</label>${o.area?`<textarea id="${name}" name="${name}" rows="${o.rows||5}">${esc(val)}</textarea>`:`<input id="${name}" name="${name}" type="${o.type||'text'}" value="${esc(val)}"${o.req?' required':''}${o.step?` step="${o.step}"`:''}${o.ph?` placeholder="${esc(o.ph)}"`:''}>`}${o.hint?`<small>${o.hint}</small>`:''}</div>`;
const myBands=()=>S.admin?S.bands:S.bands.filter(b=>S.mine.includes(b.id));

/* ----- bands ----- */
function bandList(){
  const list=myBands();
  return `<div class="bar"><h2 class="disp">${S.admin?'Bands':'Your band'}</h2>${S.admin?'<button class="btn red" data-act="new">+ Add a band</button>':''}</div>
  ${list.length?list.map(b=>`<div class="row"><div><div class="t">${esc(b.name)}${b.published?'':'<span class="tag bad">Hidden</span>'}</div><div class="s">${esc(b.location||'No location yet')} · ${b.image_url?'photo uploaded':'no uploaded photo'}</div></div><div class="a"><button class="btn sm" data-act="edit" data-id="${b.id}">Edit</button></div></div>`).join(''):'<p>No bands yet.</p>'}`;
}
function bandForm(){
  const isNew=S.edit==='new';
  const b=isNew?{published:true,sort_order:0}:S.bands.find(x=>x.id===S.edit);
  if(!b){S.edit=null;return bandList()}
  const note=(S.notes.find(n=>n.band_id===b.id)||{}).note||'';
  const pic=b.image_url||b.bandcamp_image_url||'';
  return `<form class="card" data-form="band" data-id="${isNew?'':b.id}">
  <h2 class="disp" style="margin-bottom:18px">${isNew?'Add a band':'Edit '+esc(b.name)}</h2>
  <div class="g2">${F('Band name','name',b.name,{req:1})}${F('Where from','location',b.location,{ph:'Peterborough, UK'})}</div>
  ${S.admin&&!isNew?F('Web address name (slug)','slug',b.slug,{hint:'Used in the page link. Changing it breaks old links to this band.'}):''}
  ${F('About the band','bio',b.bio,{area:1,rows:6,hint:'Plain text. A blank line starts a new paragraph.'})}
  <div class="f"><span class="lab">Photo</span>${pic?`<img class="pre" src="${esc(pic)}" alt="">`:''}<input type="file" name="photo" accept="image/*"><small>Square-ish works best. It's shrunk automatically. Leave empty to keep the current one.</small></div>
  <div class="g2">${F('Bandcamp','bandcamp_url',b.bandcamp_url,{type:'url',ph:'https://…'})}${F('Instagram','instagram_url',b.instagram_url,{type:'url',ph:'https://…'})}
  ${F('Facebook','facebook_url',b.facebook_url,{type:'url',ph:'https://…'})}${F('Spotify','spotify_url',b.spotify_url,{type:'url',ph:'https://…'})}
  ${F('YouTube','youtube_url',b.youtube_url,{type:'url',ph:'https://…'})}${F('Website','website_url',b.website_url,{type:'url',ph:'https://…'})}
  ${S.bands.length&&('video_url' in S.bands[0])?F('YouTube video','video_url',b.video_url,{type:'url',ph:'https://youtu.be/…',hint:'One video for the band page and the Videos page. Admins can add more on the Videos tab.'}):''}
  ${S.bands.length&&('merch_url' in S.bands[0])?F('Merch link','merch_url',b.merch_url,{type:'url',ph:defaultMerch(b.bandcamp_url)||'https://…',hint:'Leave blank to use the Bandcamp merch page'+(defaultMerch(b.bandcamp_url)?' ('+defaultMerch(b.bandcamp_url)+')':'')+'.'}):''}</div>
  ${S.admin?`<div class="g2"><div class="f"><span class="lab">Show on the site</span><label class="chk"><input type="checkbox" name="published" ${b.published?'checked':''}> Published</label></div>${F('Order on roster','sort_order',b.sort_order,{type:'number',hint:'Lower numbers come first.'})}</div>
  ${F('Private note (only admins see this)','note',note,{area:1,rows:3})}`:''}
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn red" type="submit">Save</button><button class="btn" type="button" data-act="cancel">Cancel</button>${S.admin&&!isNew?`<button class="btn" type="button" data-act="delBand" data-id="${b.id}" style="margin-left:auto">Delete band</button>`:''}</div>
  </form>`;
}
async function shrink(file,max=1000){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error("Couldn't read that image"));i.src=url});
    const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('Image conversion failed')),'image/jpeg',.85));
  }finally{URL.revokeObjectURL(url)}
}
function ytId(u){const m=String(u||'').trim().match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);return m?m[1]:null}
function ytLink(v){v=nul(v);if(!v)return null;const id=ytId(v);if(!id)throw new Error("That doesn't look like a YouTube video link. Copy it from the video's Share button, e.g. https://youtu.be/abc123");return 'https://www.youtube.com/watch?v='+id}
const defaultMerch=u=>{try{return u?new URL(u).origin+'/merch':''}catch(e){return ''}};
async function saveBand(form){
  const id=form.dataset.id,d=new FormData(form);
  const row={name:nul(d.get('name')),location:nul(d.get('location')),bio:nul(d.get('bio')),
    bandcamp_url:link(d.get('bandcamp_url')),instagram_url:link(d.get('instagram_url')),facebook_url:link(d.get('facebook_url')),
    spotify_url:link(d.get('spotify_url')),youtube_url:link(d.get('youtube_url')),website_url:link(d.get('website_url'))};
  if(form.merch_url)row.merch_url=link(d.get('merch_url'));
  if(form.video_url)row.video_url=ytLink(d.get('video_url'));
  if(!row.name)throw new Error('The band needs a name');
  if(S.admin){row.published=d.has('published');row.sort_order=parseInt(d.get('sort_order'),10)||0}
  let bandId=id;
  if(!id){row.slug=slugify(row.name);bandId=ck(await db.from('bands').insert(row).select('id').single()).id}
  else{if(S.admin&&d.get('slug'))row.slug=slugify(d.get('slug'));ck(await db.from('bands').update(row).eq('id',id))}
  const file=form.photo.files[0];
  if(file){
    const blob=await shrink(file);
    const path=bandId+'/'+Date.now()+'.jpg';
    ck(await db.storage.from('band-images').upload(path,blob,{contentType:'image/jpeg'}));
    const pub=db.storage.from('band-images').getPublicUrl(path).data.publicUrl;
    ck(await db.from('bands').update({image_url:pub}).eq('id',bandId));
  }
  if(S.admin){
    const note=nul(d.get('note'));
    if(note)ck(await db.from('band_notes').upsert({band_id:bandId,note}));
    else ck(await db.from('band_notes').delete().eq('band_id',bandId));
  }
}

/* ----- gigs ----- */
const STATUS=[['on_sale','On sale'],['sold_out','Sold out'],['free','Free'],['cancelled','Cancelled']];
const tagged=g=>(g.gig_acts||[]).some(x=>x.band_id&&S.mine.includes(x.band_id));
const canGig=g=>S.admin||g.created_by===S.user.id||tagged(g);
const lineupText=g=>(g.gig_acts||[]).slice().sort((a,b)=>a.position-b.position).map(a=>a.bands?a.bands.name:a.act_name).join('\n');
function gigRow(g){
  const st=g.status!=='on_sale'?`<span class="tag ${g.status==='cancelled'?'bad':''}">${esc((STATUS.find(s=>s[0]===g.status)||[0,g.status])[1])}</span>`:'';
  return `<div class="row"><div><div class="t">${esc(g.title)}${st}</div><div class="s">${fmt(g.event_date)} · ${esc(g.venue_name||'Venue TBC')}${g.time_text?' · '+esc(g.time_text):''}</div></div>
  <div class="a"><button class="btn sm" data-act="dupGig" data-id="${g.id}">Copy</button>${canGig(g)?`<button class="btn sm" data-act="edit" data-id="${g.id}">Edit</button>`:''}</div></div>`;
}
function gigList(){
  const mineOnly=S.admin?S.gigs:S.gigs.filter(canGig);

async function saveGig(form){

  if(!row.title||!row.event_date)throw new Error('A gig needs a title and a date');
  const pf=form.poster&&form.poster.files[0];
  if(pf){const blob=await shrink(pf,1400);const path=S.user.id+'/'+Date.now()+'.jpg';
    ck(await db.storage.from('gig-posters').upload(path,blob,{contentType:'image/jpeg'}));

  else if(d.has('rmposter'))row.poster_url=null;

  else ck(await db.from('gigs').update(row).eq('id',id));
  const byName=new Map(S.bands.map(b=>[b.name.toLowerCase(),b.id]));
  const acts=(d.get('lineup')||'').split('\n').map(s=>s.trim()).filter(Boolean).map((l,i)=>{const b=byName.get(l.toLowerCase());return b?{gig_id:gid,band_id:b,position:i}:{gig_id:gid,act_name:l,position:i}});
  const rp=await db.rpc('set_gig_acts',{p_gig:gid,p_acts:acts.map(x=>({band_id:x.band_id||'',act_name:x.act_name||'',position:x.position}))});
  if(rp.error){
    // 10-gigs-for-tagged-bands.sql not run yet: fall back to the older way

    ck(await db.from('gig_acts').delete().eq('gig_id',gid));
    if(acts.length)ck(await db.from('gig_acts').insert(acts));
  }
}

async function saveRelease(form){
  const id=form.dataset.id,d=new FormData(form);
  const row={title:nul(d.get('title')),artist_text:nul(d.get('artist_text')),type:nul(d.get('type')),released_text:nul(d.get('released_text')),

  if(!row.title)throw new Error('A release needs a title');
  const allowed=myBands().map(b=>b.id),picked=d.getAll('rb').filter(b=>allowed.includes(b));

  else ck(await db.from('releases').update(row).eq('id',id));
  // one step on the server (11-releases-for-band-members.sql); the old delete-then-insert locked bands out of releases an admin made
  const rp=await db.rpc('set_release_bands',{p_release:rid,p_bands:picked});
  if(rp.error){
    if(!/set_release_bands|schema cache|Could not find/i.test(rp.error.message||''))throw rp.error;
    if(S.admin)ck(await db.from('release_bands').delete().eq('release_id',rid));
    else if(S.mine.length)ck(await db.from('release_bands').delete().eq('release_id',rid).in('band_id',S.mine));
    const links=picked.map(b=>({release_id:rid,band_id:b}));
    if(links.length)ck(await db.from('release_bands').insert(links));
  }
}

/* ----- featured release box (admin) ----- */
const FEAT_DEFAULT={kicker:'Featured · Sep 2023',title:'Friends, Volume 3',blurb:"Songs from bands who are with us on Socks On Records, or have worked with us on gigs. Every penny from sales, minus Bandcamp's fees, goes to MIND CPSL.",link_url:'https://socksonrecords.bandcamp.com/album/socks-on-records-and-friends-volume-3',embed_url:'',cover_url:''};
function bcEmbed(v){
  v=nul(v);if(!v)return null;
  const m=v.match(/src=["']([^"']+)["']/i),u=(m?m[1]:v).trim();
  const id=u.match(/^https:\/\/bandcamp\.com\/EmbeddedPlayer\/.*?\b(album|track)=(\d+)/);
  if(!id)throw new Error("That doesn't look like a Bandcamp player. On the Bandcamp release page choose Share / Embed, pick the album player, then paste the whole code (or just the link inside src=\"...\").");
  return 'https://bandcamp.com/EmbeddedPlayer/'+id[1]+'='+id[2]+'/';
}
const playerSrc=u=>{const m=/(album|track)=(\d+)/.exec(u||'');return m?`https://bandcamp.com/EmbeddedPlayer/${m[1]}=${m[2]}/size=large/bgcol=16130F/linkcol=86AEB9/tracklist=false/artwork=small/transparent=true/`:''};
const prevSrc=u=>{try{const e=bcEmbed(u);return e?playerSrc(e):''}catch(x){return ''}};
const previewHtml=u=>{try{const e=bcEmbed(u);return e?`<iframe data-src="${playerSrc(e)}" style="border:0;width:100%;max-width:480px;height:120px;display:block;background:#16130F" src="${playerSrc(e)}" title="Player preview" seamless></iframe>`:'<small>No player yet. Paste an embed code above to add one.</small>'}catch(x){return '<small style="color:var(--red)">'+esc(x.message)+'</small>'}};
/* only touch the player when the link really changed, so it keeps playing while you type elsewhere */
function setPreview(u){
  const box=$('#fprev');if(!box)return;
  const want=prevSrc(u),cur=box.querySelector('iframe');
  if(want&&cur&&cur.dataset.src===want)return;
  box.innerHTML=previewHtml(u);
}

  if(!S.settings)return `<div class="note"><strong>One setup step first.</strong> Run <code>03-featured-and-crawl.sql</code> (in the supabase folder) in the Supabase SQL Editor, then reload this page.</div>`;

    return `<h3 class="disp" style="font-size:26px;margin:28px 0 8px">${label}</h3>`+(items.length?items.map(i=>`<div class="row"><div style="min-width:220px;flex:1"><div class="t">${esc(i.title)}${i.published?'':'<span class="tag bad">Hidden</span>'}${i.stock<=0?'<span class="tag bad">Sold out</span>':i.stock<=5?'<span class="tag" style="background:#f2d14a">Low</span>':''}</div><div class="s">${gbp(i.price_pence)} · ${i.buy_url?'has a buy link':'no buy link yet (shows "Coming soon")'}</div></div>
    <div class="a" style="align-items:center"><span class="lab" style="margin-right:4px">Stock</span><button class="btn sm" data-act="stock" data-id="${i.id}" data-d="-1" aria-label="One less">−</button><strong style="min-width:34px;text-align:center;font-size:20px">${i.stock}</strong><button class="btn sm" data-act="stock" data-id="${i.id}" data-d="1" aria-label="One more">+</button><button class="btn sm" data-act="stock" data-id="${i.id}" data-d="10">+10</button><button class="btn sm" data-act="edit" data-id="${i.id}" style="margin-left:10px">Edit</button></div></div>`).join(''):'<p>Nothing here yet.</p>');
  };
  return `<div class="bar"><h2 class="disp">Shop</h2><button class="btn red" data-act="new">+ Add an item</button></div>
  <p class="note"><strong>Not on the public menu yet.</strong> The site's Merch link currently goes to Big Cartel. This page is built and ready (at <code>#/shop</code>) for when you decide. This is the Merch &amp; Tickets page. Use − and + to keep the stock right: at 5 or fewer it shows "Only N left", at 0 it shows "Sold out". Paste a link in <strong>Buy link</strong> (your Dodge Designed This shop, Big Cartel, a ticket seller) and the Buy button goes live. Payments happen on that site, not here.</p>
  ${grp('merch','Merch')}${grp('ticket','Tickets')}`;
}
function shopForm(){
  const isNew=S.edit==='new',i=isNew?{kind:'merch',price_pence:1000,stock:0,published:true,sort_order:0}:S.shop.find(x=>x.id===S.edit);
  if(!i){S.edit=null;return shopView()}
  return `<form class="card" data-form="shop" data-id="${isNew?'':i.id}"><h2 class="disp" style="margin-bottom:18px">${isNew?'Add an item':'Edit item'}</h2>
  <div class="g2"><div class="f"><label for="kind">Goes in</label><select id="kind" name="kind"><option value="merch"${i.kind==='merch'?' selected':''}>Merch</option><option value="ticket"${i.kind==='ticket'?' selected':''}>Tickets</option></select></div>${F('Name','title',i.title,{req:1})}</div>
  ${F('Description','description',i.description,{area:1,rows:3})}
  <div class="g2">${F('Price (£)','price',(i.price_pence/100).toFixed(2),{type:'number',step:'0.01',req:1,hint:'e.g. 10 or 12.50'})}${F('Stock','stock',i.stock,{type:'number',hint:'How many you have. 0 shows Sold out.'})}</div>
  ${F('Buy link','buy_url',i.buy_url,{type:'url',ph:'https://…',hint:'Where the Buy button goes. Leave empty to show "Coming soon".'})}
  <div class="f"><span class="lab">Picture</span>${i.image_url?`<img class="pre" style="width:auto;max-width:220px;height:auto" src="${esc(i.image_url)}" alt=""><label class="chk"><input type="checkbox" name="rmimg"> Remove this picture</label>`:''}<input type="file" name="image" accept="image/*"><small>Square works best. Without one the tile shows a simple drawing of a tee, CD, cap or ticket.</small></div>
  <div class="g2">${F('Order','sort_order',i.sort_order,{type:'number',hint:'Lower numbers come first.'})}<div></div></div>
  <label class="chk" style="margin-bottom:18px"><input type="checkbox" name="published" ${i.published?'checked':''}> Show on the site</label>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn red" type="submit">Save</button><button class="btn" type="button" data-act="cancel">Cancel</button>${!isNew?`<button class="btn" type="button" data-act="delShop" data-id="${i.id}" style="margin-left:auto">Delete</button>`:''}</div></form>`;
}
async function saveShop(form){
  const id=form.dataset.id,d=new FormData(form);
  const price=Math.round(parseFloat(d.get('price'))*100);
  const row={kind:d.get('kind'),title:nul(d.get('title')),description:nul(d.get('description')),price_pence:price,stock:Math.max(0,parseInt(d.get('stock'),10)||0),buy_url:link(d.get('buy_url')),sort_order:parseInt(d.get('sort_order'),10)||0,published:d.has('published')};
  if(!row.title)throw new Error('The item needs a name');
  if(!(price>=0))throw new Error('Enter a price, like 10 or 12.50');
  const f=form.image&&form.image.files[0];
  if(f){const blob=await shrink(f,1000);const path=S.user.id+'/shop-'+Date.now()+'.jpg';
    ck(await db.storage.from('gig-posters').upload(path,blob,{contentType:'image/jpeg'}));
    row.image_url=db.storage.from('gig-posters').getPublicUrl(path).data.publicUrl}
  else if(d.has('rmimg'))row.image_url=null;
  if(id)ck(await db.from('shop_items').update(row).eq('id',id));else ck(await db.from('shop_items').insert(row));
}

/* ----- users (admin) ----- */
function ago(d){if(!d)return null;const s=(Date.now()-new Date(d).getTime())/1000;if(s<90)return 'just now';const m=Math.round(s/60);if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');const dd=Math.round(h/24);if(dd<31)return dd+(dd===1?' day ago':' days ago');const mo=Math.round(dd/30);if(mo<12)return mo+(mo===1?' month ago':' months ago');return Math.round(dd/365)+' yr ago'}
function fmtDT(d){try{return new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return String(d)}}
function peopleView(){
  const bn=id=>(S.bands.find(b=>b.id===id)||{name:'?'}).name;
  const opts=S.bands.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
  const out=S.addResult?`<div class="note" style="margin-top:16px"><strong>${esc(S.addResult.head)}</strong><ul style="margin:8px 0 0 18px">${S.addResult.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`:'';
  const have=!!S.users;
  const list=(have?S.users:S.people).slice().sort((a,b)=>String(a.display_name||a.email||'').toLowerCase().localeCompare(String(b.display_name||b.email||'').toLowerCase()));
  const signed=have?list.filter(u=>u.last_sign_in_at).length:0;
  const setup=have?'':`<div class="note" style="margin-bottom:20px"><strong>One more step for last login.</strong> Run <code>08-users-screen.sql</code> in the Supabase SQL Editor and this screen will show when each person last signed in. Everything else works without it.</div>`;
  return `<div class="bar"><h2 class="disp">Users</h2></div>
  ${setup}
  <details class="card" style="margin-bottom:24px" ${S.addResult?'open':''}><summary class="disp" style="font-size:24px;cursor:pointer">Add people</summary>
  <form data-form="addpeople" style="margin-top:12px">
  <p style="margin-bottom:12px">One person per line: <code>email, name, band</code>. For more than one band just keep adding them, e.g. <code>sam@example.com, Sam, Mices, Sprainer</code>. Everyone gets the shared password below, and they can change it themselves in the Account tab.</p>
  <div class="f"><label for="ap-lines">People</label><textarea id="ap-lines" name="lines" rows="6" placeholder="sam@example.com, Sam Smith, Mices&#10;jo@example.com, Jo Bloggs, Das Kapitans"></textarea></div>
  <div class="f" style="max-width:340px"><label for="ap-pw">Shared password</label><input id="ap-pw" name="password" type="text" minlength="8" required autocomplete="off" placeholder="At least 8 characters"></div>
  <button class="btn red" type="submit">Create logins</button>${out}</form></details>
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><div class="f" style="margin:0;flex:1;min-width:220px;max-width:380px"><label for="ufilter" class="lab">Find someone</label><input id="ufilter" type="search" placeholder="Name, email or band" autocomplete="off"></div>
  <div class="mono" style="flex:1">${list.length} ${list.length===1?'user':'users'}${have?' · '+signed+' have signed in · '+(list.length-signed)+' not yet':''}</div></div>
  ${list.map(p=>{
    const ms=S.members.filter(m=>m.user_id===p.id),me=p.id===S.user.id;
    const label=p.display_name||p.email||p.id;
    const last=have?(p.last_sign_in_at?`<span title="${esc(fmtDT(p.last_sign_in_at))}">Last signed in <strong>${esc(ago(p.last_sign_in_at))}</strong></span>`:'<span class="tag bad" style="margin:0">Never signed in</span>'):'';
    const search=(label+' '+(p.email||'')+' '+ms.map(m=>bn(m.band_id)).join(' ')).toLowerCase();
    return `<div class="row urow" data-search="${esc(search)}" style="align-items:flex-start"><div style="min-width:240px;flex:1"><div class="t" style="text-transform:none;font-family:'Archivo',sans-serif;font-weight:700;font-size:18px">${esc(label)}${me?'<span class="tag">You</span>':''}${p.is_admin?'<span class="tag" style="background:var(--yellow,#f2d14a)">Admin</span>':''}</div>
    ${p.display_name?`<div class="s">${esc(p.email||'')}</div>`:''}
    ${last?`<div class="s" style="margin-top:4px">${last}${p.created_at?' · added '+esc(fmtDT(p.created_at).split(',')[0]):''}</div>`:''}
    ${me?'':`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sm ${p.is_admin?'':'red'}" data-act="setAdmin" data-id="${p.id}" data-v="${p.is_admin?0:1}" data-name="${esc(label)}">${p.is_admin?'Remove admin':'Make admin'}</button><button class="btn sm" data-act="setPw" data-id="${p.id}" data-name="${esc(p.email||'')}">Set password</button><button class="btn sm" data-act="delUser" data-id="${p.id}" data-name="${esc(p.email||'')}">Remove login</button></div>`}</div>
    <div style="flex:2;min-width:260px"><div class="lab" style="margin-bottom:6px">Can edit these bands</div>
    ${ms.length?ms.map(m=>`<span class="chip">${esc(bn(m.band_id))}<button title="Remove" aria-label="Remove ${esc(bn(m.band_id))}" data-act="rmMember" data-u="${p.id}" data-b="${m.band_id}" data-name="${esc(label)}">×</button></span>`).join(''):'<div class="s" style="margin-bottom:6px">None</div>'}
    <div style="display:flex;gap:8px;margin-top:6px"><select aria-label="Band to add">${opts}</select><button class="btn sm" data-act="addMember" data-u="${p.id}" data-name="${esc(label)}">Add</button></div></div></div>`}).join('')}
  <p id="unone" class="mono" style="display:none;margin-top:16px">Nobody matches that.</p>`;
}

const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
async function addPeople(form){
  const pw=form.password.value;
  if(pw.length<8)throw new Error('The password needs at least 8 characters');
  const rows=form.lines.value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!rows.length)throw new Error('Add at least one line: email, name, band');
  const done=[],bad=[];
  for(const line of rows){
    const parts=line.split(/[,\t]/).map(s=>s.trim());
    const email=parts[0],name=parts[1]||'',names=parts.slice(2).filter(Boolean);
    const ids=[],miss=[];
    names.forEach(n=>{const b=S.bands.find(x=>norm(x.name)===norm(n)||norm(x.slug)===norm(n));b?ids.push(b.id):miss.push(n)});
    if(miss.length){bad.push(email+': no band called "'+miss.join('", "')+'", so nothing was created for this line');continue}
    const r=await db.rpc('admin_create_user',{p_email:email,p_name:name,p_password:pw,p_band_ids:ids});
    if(r.error)bad.push(email+': '+r.error.message);else done.push(email+(names.length?' → '+names.join(', '):' (no band yet)'));
  }
  S.addResult={head:done.length+' created'+(bad.length?', '+bad.length+' not created':'')+'.',lines:done.map(x=>'Created '+x).concat(bad)};
  if(!bad.length)form.lines.value='';
  await reload();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='INPUT')return;
  const a=t.dataset.act,id=t.dataset.id;
  run(async()=>{
    if(a==='tab'){S.tab=t.dataset.tab;S.edit=null;S.addResult=null;render()}
    else if(a==='new'){S.edit='new';render()}
    else if(a==='edit'){S.edit=id;render()}
    else if(a==='cancel'){S.edit=null;render()}
    else if(a==='dupGig'){S.edit={copy:id};render()}
    else if(a==='signout'){try{await db.auth.signOut()}finally{S.user=null;S.profile=null;S.ready=false;S.edit=null;S.admin=false;lastKey='';render()}}
    else if(a==='delBand'){if(confirm('Delete this band for good? Their gigs stay, but lose the link to the band.')){ck(await db.from('bands').delete().eq('id',id));S.edit=null;await reload();toast('Band deleted')}}
    else if(a==='delGig'){if(confirm('Delete this gig?')){ck(await db.from('gigs').delete().eq('id',id));S.edit=null;await reload();toast('Gig deleted')}}
    else if(a==='delRelease'){if(confirm('Delete this release?')){ck(await db.from('releases').delete().eq('id',id));S.edit=null;await reload();toast('Release deleted')}}
    else if(a==='addMember'){const sel=t.parentElement.querySelector('select');if(!sel.value)return;const bname=sel.options[sel.selectedIndex].text;ck(await db.from('band_members').upsert({band_id:sel.value,user_id:t.dataset.u},{onConflict:'band_id,user_id',ignoreDuplicates:true}));await reload();toast(t.dataset.name+' can now edit '+bname)}
    else if(a==='setAdmin'){const on=t.dataset.v==='1';if(!confirm(on?'Make '+t.dataset.name+' an admin? They will be able to edit everything, including other people\'s logins.':'Remove admin from '+t.dataset.name+'? They will keep access to their own bands.'))return;
      if(S.users){ck(await db.rpc('admin_set_admin',{p_user:id,p_admin:on}))}else{ck(await db.from('profiles').update({is_admin:on}).eq('id',id))}
      await reload();toast(t.dataset.name+(on?' is now an admin':' is no longer an admin'))}
    else if(a==='delVideo'){if(confirm('Delete this video?')){ck(await db.from('videos').delete().eq('id',id));S.edit=null;await reload();toast('Video deleted')}}
    else if(a==='delSession'){if(confirm('Delete this session?')){ck(await db.from('sessions').delete().eq('id',id));S.edit=null;await reload();toast('Session deleted')}}
    else if(a==='delShop'){if(confirm('Delete this item?')){ck(await db.from('shop_items').delete().eq('id',id));S.edit=null;await reload();toast('Item deleted')}}
    else if(a==='stock'){const it=S.shop.find(x=>x.id===id),n=Math.max(0,it.stock+parseInt(t.dataset.d,10));ck(await db.from('shop_items').update({stock:n}).eq('id',id));it.stock=n;render();toast(it.title+': '+n+' in stock')}
    else if(a==='delSub'){if(confirm('Remove '+t.dataset.name+' from the list?')){ck(await db.from('subscribers').delete().eq('id',id));await reload();toast('Removed')}}
    else if(a==='copySubs'){const txt=S.subs.map(s=>s.email).join(', ');try{await navigator.clipboard.writeText(txt);toast(S.subs.length+' emails copied')}catch(x){prompt('Copy these emails:',txt)}}
    else if(a==='csvSubs'){const csv='email,signed_up\n'+S.subs.map(s=>'"'+String(s.email).replace(/"/g,'""')+'",'+(s.created_at||'').slice(0,10)).join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const l=document.createElement('a');l.href=u;l.download='socks-on-subscribers.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
    else if(a==='setPw'){const pw=prompt('New password for '+t.dataset.name+' (at least 8 characters):');if(!pw)return;ck(await db.rpc('admin_set_password',{p_user:id,p_password:pw}));toast('Password changed for '+t.dataset.name)}
    else if(a==='delUser'){if(confirm('Remove the login for '+t.dataset.name+'? They will no longer be able to sign in. Their bands, gigs and releases stay.')){ck(await db.rpc('admin_delete_user',{p_user:id}));await reload();toast('Login removed')}}
    else if(a==='rmMember'){ck(await db.from('band_members').delete().eq('band_id',t.dataset.b).eq('user_id',t.dataset.u));await reload();toast('Removed '+t.dataset.name+' from that band')}
  });
});
app.addEventListener('input',e=>{
  if(e.target.id==='ufilter'){const q=e.target.value.trim().toLowerCase();let n=0;document.querySelectorAll('.urow').forEach(r=>{const ok=!q||r.dataset.search.includes(q);r.style.display=ok?'':'none';if(ok)n++});const z=document.getElementById('unone');if(z)z.style.display=n?'none':'block'}if(e.target.name==='embed_url'&&e.target.closest('[data-form=featured]'))setPreview(e.target.value)});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='pickRelease'){
    const r=S.releases.find(x=>x.id===t.value),f=t.closest('form');if(!r)return;
    f.title.value=r.title||'';f.kicker.value='Featured'+(r.released_text?' · '+r.released_text:'');
    f.blurb.value=r.description||f.blurb.value;f.link_url.value=r.bandcamp_url||'';f.cover_url.value=r.cover_url||'';
    f.embed_url.value=r.embed_url||'';setPreview(r.embed_url);
  }
});
app.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const kind=f.dataset.form,btn=f.querySelector('button[type=submit]');
  if(btn)btn.disabled=true;
  run(async()=>{
    try{
      if(kind==='pw'){
        const r=await db.auth.signInWithPassword({email:f.email.value.trim(),password:f.password.value});
        if(r.error)throw r.error;
      }else if(kind==='setpw'){
        if(f.password.value!==f.password2.value)throw new Error("The two passwords don't match");
        const r=await db.auth.updateUser({password:f.password.value});
        if(r.error)throw r.error;f.reset();toast('Password saved');
      }else if(kind==='profile'){
        ck(await db.from('profiles').update({display_name:nul(f.display_name.value)}).eq('id',S.user.id));
        S.profile.display_name=nul(f.display_name.value);toast('Saved');
      }else if(kind==='addpeople'){await addPeople(f)
      }else if(kind==='band'){await saveBand(f);S.edit=null;await reload();toast('Saved. The site shows it straight away.')}
      else if(kind==='gig'){await saveGig(f);S.edit=null;await reload();toast('Gig saved')}
      else if(kind==='featured'){await saveFeatured(f);toast('Saved. The Releases page shows it straight away.')}
      else if(kind==='release'){await saveRelease(f);S.edit=null;await reload();toast('Release saved')}
      else if(kind==='shop'){await saveShop(f);S.edit=null;await reload();toast('Item saved')}
      else if(kind==='video'){await saveVideo(f);S.edit=null;await reload();toast('Video saved')}
      else if(kind==='session'){await saveSession(f);S.edit=null;await reload();toast('Session saved')}
    }finally{if(btn&&document.body.contains(btn))btn.disabled=false}
  });
});

/* ---------- start ---------- */
(function(){const m=location.hash.match(/error_description=([^&]+)/);if(m)setTimeout(()=>toast(decodeURIComponent(m[1].replace(/\+/g,' '))+'. Please sign in with your email and password.',true),300)})();
let started=false,lastKey='';
db.auth.onAuthStateChange((ev,session)=>{
  // don't call the API inside this callback, defer it
  setTimeout(()=>run(async()=>{
    const u=session&&session.user||null,key=u?u.id:'';
    if(started&&key===lastKey){if(u)S.user=u;return}
    started=true;lastKey=key;S.user=u;S.ready=false;S.edit=null;
    render();
    if(!u)return;
    if(location.hash.includes('access_token'))history.replaceState(null,'',location.pathname);
    await load();render();
  }),0);
});
