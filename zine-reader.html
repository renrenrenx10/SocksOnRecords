<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanzine Reader</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; height:100dvh; background:#111; color:#eee;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; overflow:hidden; }
  #wrap{ position:fixed; inset:0; display:flex; flex-direction:column; }
  #bar{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 14px; background:#191919; border-bottom:1px solid #2c2c2c; flex:0 0 auto; z-index:5; }
  #bar h1{ font-size:15px; margin:0; font-weight:600; color:#f1ede1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bar .nav{ display:flex; gap:8px; align-items:center; }
  #bar button{ background:#2a2a2a; color:#eee; border:1px solid #3a3a3a; border-radius:8px;
    padding:8px 12px; font-size:14px; cursor:pointer; }
  #bar button:disabled{ opacity:.35; cursor:default; }
  #bar .pageNum{ font-size:13px; color:#aaa; min-width:52px; text-align:center; }
  #stage{ flex:1 1 auto; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #flipbook{ box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #flipbook canvas, #flipbook img{ width:100%; height:100%; object-fit:contain; display:block; background:#fff; }
  /* Positioned to exactly cover whichever page(s) the flipbook currently shows (see
     syncLinkOverlay() in the script). Hidden during the flip animation -- the page-flip library
     draws everything to a single <canvas> with a curling/perspective effect mid-flip, so a flat
     positioned link would be in the wrong place (or over the wrong page) for the length of that
     animation; it only matches reality once a page has settled. */
  #linkOverlay{ position:fixed; pointer-events:none; display:none; z-index:3; }
  #linkOverlay a{ position:absolute; display:block; pointer-events:auto; cursor:pointer;
    -webkit-tap-highlight-color:rgba(255,255,255,.15); }
  #status{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; text-align:center; padding:30px; }
  #status p{ max-width:360px; color:#bbb; font-size:14px; line-height:1.5; margin:0; }
  #status .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid #333; border-top-color:#e8572c; animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #status.hidden{ display:none; }
  a.homeLink{ color:#e8572c; text-decoration:none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <h1 id="issueTitle">Fanzine</h1>
    <div class="nav">
      <button id="prevBtn" aria-label="Previous page">‹</button>
      <span class="pageNum" id="pageNum">–</span>
      <button id="nextBtn" aria-label="Next page">›</button>
    </div>
  </div>
  <div id="stage">
    <div id="flipbook" hidden></div>
    <div id="linkOverlay"></div>
    <div id="status">
      <div class="spinner" id="spinner"></div>
      <p id="statusText">Loading issue…</p>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://xnbkdgmojfupjerqorcw.supabase.co";
  var SUPABASE_KEY = "sb_publishable__XrZLQTrqwf9xeLBn5xI7w_vVgFJzCf";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  var spinner = document.getElementById("spinner");
  var flipbookEl = document.getElementById("flipbook");
  var issueTitleEl = document.getElementById("issueTitle");
  var pageNumEl = document.getElementById("pageNum");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");

  function fail(message, opts){
    spinner.style.display = "none";
    statusText.innerHTML = message;
    if(opts && opts.showHome){
      var a = document.createElement("a");
      a.href = "/";
      a.className = "homeLink";
      a.textContent = "← Back to Socks On Records";
      statusText.appendChild(document.createElement("br"));
      statusText.appendChild(a);
    }
  }

  var params = new URLSearchParams(location.search);
  var issueNumber = parseInt(params.get("issue"), 10);
  if(!issueNumber || issueNumber < 1){
    fail("No issue specified. Add <code>?issue=1</code> to the link to open an issue.");
  } else {
    issueTitleEl.textContent = "Issue " + issueNumber;
    loadIssue(issueNumber);
  }

  function loadIssue(n){
    sb.from("zine_issues").select("*").eq("issue_number", n).eq("published", true).maybeSingle()
      .then(function(res){
        if(res.error){ fail("Couldn't load this issue right now. Try again shortly."); return; }
        var row = res.data;
        if(!row || !row.pdf_url){
          fail("Issue " + n + " isn't available yet.", { showHome:true });
          return;
        }
        if(row.title){ issueTitleEl.textContent = row.title; }
        statusText.textContent = "Rendering pages…";
        // Pull each page's link hotspots alongside the PDF. The builder exports PDF pages in the
        // same page_order-ascending sequence it edits them in (pagesInIssue() / exportIssuePdf()),
        // so sorting this query the same way lines array index N here up 1:1 with PDF page N+1 --
        // no page id/number needs to travel through the PDF itself. A failed or empty fetch here
        // just means no pages are clickable; it should never block the zine itself from opening.
        sb.from("zine_pages").select("elements").eq("issue_number", n).order("page_order", { ascending: true })
          .then(function(pagesRes){
            var pageLinks = (!pagesRes.error && pagesRes.data ? pagesRes.data : []).map(function(p){
              return (p.elements || []).filter(function(el){ return el && el.linkUrl; })
                .map(function(el){ return { x: el.x, y: el.y, w: el.w, h: el.h, url: el.linkUrl }; });
            });
            renderPdfToFlipbook(row.pdf_url, pageLinks);
          });
      });
  }

  function renderPdfToFlipbook(url, pageLinks){
    pdfjsLib.getDocument(url).promise.then(function(pdf){
      var pageCount = pdf.numPages;
      var images = [];
      var scale = Math.min(2.2, Math.max(1.4, window.devicePixelRatio || 1.5));

      function renderPage(i){
        return pdf.getPage(i).then(function(page){
          var viewport = page.getViewport({ scale: scale });
          var canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          var ctx = canvas.getContext("2d");
          return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function(){
            images.push(canvas.toDataURL("image/jpeg", 0.88));
          });
        });
      }

      var chain = Promise.resolve();
      for(var i=1; i<=pageCount; i++){
        (function(pageIndex){
          chain = chain.then(function(){
            statusText.textContent = "Rendering page " + pageIndex + " of " + pageCount + "…";
            return renderPage(pageIndex);
          });
        })(i);
      }

      chain.then(function(){
        statusEl.classList.add("hidden");
        flipbookEl.hidden = false;
        startFlipbook(images, pageLinks);
      }).catch(function(err){
        console.error(err);
        fail("Something went wrong rendering this issue.");
      });
    }).catch(function(err){
      console.error(err);
      fail("Couldn't open the PDF for this issue.");
    });
  }

  // "stretch" sizing fills the whole stage regardless of the page's actual A4 proportions, which
  // is what was zooming in and cropping pages. "fixed" sizing with a size we compute ourselves
  // (preserving the 210/297 ratio, fitted to whatever room is actually available) shows each page
  // whole. Fixed mode doesn't resize itself, so on window resize we tear down and rebuild at the
  // new size rather than trying to reflow in place.
  function startFlipbook(images, pageLinks){
    var stage = document.getElementById("stage");
    var linkOverlay = document.getElementById("linkOverlay");
    var ratio = 210/297; // A4 portrait
    var pageFlip = null;

    // Decide spread-vs-single by whether there's comfortably enough WIDTH for two pages
    // side by side (desktop, tablets, phones held landscape with enough room) -- not by
    // an absolute pixel floor, which on an ordinary portrait phone was satisfied by a
    // narrow half-width spread page instead of falling back to one full-size page, so
    // the page rendered small and centered with the rest of the screen empty.
    function sizeFor(){
      var pad = 20;
      var maxW = Math.max(100, stage.clientWidth - pad*2);
      var maxH = Math.max(100, stage.clientHeight - pad*2);
      var spreadW = maxH * ratio * 2;
      var isSpread = maxW >= spreadW * 0.92;
      var w = isSpread ? Math.min(maxW/2, maxH*ratio) : Math.min(maxW, maxH*ratio);
      w = Math.max(100, Math.floor(w));
      var h = Math.floor(w / ratio);
      return { w: w, h: h };
    }

    function updateNav(){
      if(!pageFlip) return;
      var cur = pageFlip.getCurrentPageIndex();
      var total = pageFlip.getPageCount();
      pageNumEl.textContent = (cur+1) + " / " + total;
      prevBtn.disabled = cur <= 0;
      nextBtn.disabled = cur >= total-1;
    }

    // Link hotspots are an absolutely-positioned overlay drawn on top of the flipbook, not part
    // of the page images themselves -- the library renders every page onto one <canvas> (see the
    // isolated test that mapped this out: getOrientation()/getCurrentPageIndex() against the real
    // page-flip@2.0.7 build), so there's no per-page DOM element to attach a link to directly.
    // Confirmed mapping: in single-page ("portrait") mode the current index is the one visible
    // page; in two-page ("landscape") spread mode the current index is the LEFT page and index+1
    // is the right page, each occupying exactly half of .stf__wrapper's own on-screen box. That
    // box only reflects reality while the book is settled -- mid-flip the library curls the page
    // across the canvas with a perspective transform a flat overlay can't follow, so the overlay
    // is hidden for the length of any "flipping" state and only shown/repositioned once the
    // library reports "read" again.
    function hideLinkOverlay(){ linkOverlay.style.display = "none"; }
    // Called both directly (e.g. after build()) and as the library's "changeState" event handler.
    // IMPORTANT: when called as that event handler, don't trust pageFlip.getState() -- the library
    // fires "changeState" with the new state as the event's own data BEFORE it updates its internal
    // state field, so a synchronous getState() call from inside the handler still reads the OLD
    // state one step behind (confirmed by tracing the vendored library's setState()/trigger() code).
    // Prefer the event's own state value when we have it; only fall back to getState() for a direct,
    // non-event call.
    function syncLinkOverlay(stateEvent){
      var state = (stateEvent && stateEvent.data) ? stateEvent.data : (pageFlip && pageFlip.getState());
      if(!pageFlip || !pageLinks || pageLinks.length === 0){ hideLinkOverlay(); return; }
      if(state !== "read"){ hideLinkOverlay(); return; }
      var wrapper = flipbookEl.querySelector(".stf__wrapper");
      if(!wrapper){ hideLinkOverlay(); return; }
      var r = wrapper.getBoundingClientRect();
      var spread = pageFlip.getOrientation() === "landscape";
      var slots = spread ? 2 : 1;
      var total = pageFlip.getPageCount();
      var idx = pageFlip.getCurrentPageIndex();
      var html = "";
      for(var slot=0; slot<slots; slot++){
        var pageIndex = idx + slot;
        if(pageIndex < 0 || pageIndex >= total) continue;
        var links = pageLinks[pageIndex];
        if(!links || links.length === 0) continue;
        var offsetPct = slot * (100/slots);
        links.forEach(function(link){
          var left = offsetPct + (link.x / slots);
          var width = link.w / slots;
          html += '<a href="' + escapeHtml(link.url) + '" target="_blank" rel="noopener noreferrer" ' +
            'style="left:' + left + '%; top:' + link.y + '%; width:' + width + '%; height:' + link.h + '%;"></a>';
        });
      }
      linkOverlay.innerHTML = html;
      linkOverlay.style.left = r.left + "px";
      linkOverlay.style.top = r.top + "px";
      linkOverlay.style.width = r.width + "px";
      linkOverlay.style.height = r.height + "px";
      linkOverlay.style.display = html ? "block" : "none";
    }
    function escapeHtml(s){
      return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function build(){
      var wasOpen = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
      if(pageFlip){ try{ pageFlip.destroy(); }catch(err){} }
      flipbookEl.innerHTML = "";
      var size = sizeFor();
      pageFlip = new St.PageFlip(flipbookEl, {
        width: size.w,
        height: size.h,
        size: "fixed",
        showCover: false,
        usePortrait: true,
        maxShadowOpacity: 0.5,
        mobileScrollSupport: true
      });
      pageFlip.loadFromImages(images);
      pageFlip.on("flip", updateNav);
      pageFlip.on("changeState", syncLinkOverlay);
      if(wasOpen > 0 && pageFlip.flip) pageFlip.flip(wasOpen);
      updateNav();
      syncLinkOverlay();
    }
    build();

    prevBtn.addEventListener("click", function(){ pageFlip.flipPrev(); });
    nextBtn.addEventListener("click", function(){ pageFlip.flipNext(); });
    document.addEventListener("keydown", function(e){
      if(e.key === "ArrowRight") pageFlip.flipNext();
      if(e.key === "ArrowLeft") pageFlip.flipPrev();
    });

    // The page-flip library's default behaviour lets a plain tap/click anywhere on the book turn
    // the page, with no drag distance required -- so a tap that misses a link's invisible hotspot
    // by even a pixel falls through onto the book canvas underneath and flips instantly. The
    // library has a setting for this (disableFlipByClick), but it turned out to also gate the
    // library's own flipNext()/flipPrev() methods internally -- the exact ones our prev/next
    // buttons and arrow keys call -- so turning it on silently broke button/keyboard navigation
    // too (confirmed by testing).
    //
    // Instead: the library's own userStop(point, true) resets its internal "mid gesture" state
    // AND skips the flip/fold it would otherwise do -- it's the library's own way of cancelling a
    // gesture cleanly. (Blocking the DOM event instead, with stopPropagation, was tried first and
    // broke the library's own bookkeeping -- it never got to reset isUserTouch, so the NEXT tap
    // inherited stale state from the one we'd blocked and mis-fired. Calling userStop ourselves
    // avoids that entirely.) We track pointer gestures that start on the book canvas ourselves,
    // and when one ends without moving past the library's own swipe threshold (i.e. it was a tap,
    // not a swipe), call userStop(_, true) BEFORE the library's own listener gets to run (hence
    // capture:true, so ours always fires first) -- its own listener then finds isUserTouch already
    // false and does nothing. A real swipe moves past the threshold well before release, so it's
    // never touched by this and works exactly as before; our own buttons and arrow keys call
    // flipNext()/flipPrev() directly and never go through this pointer-tracking path at all, so
    // they're unaffected either way.
    var BOOK_TAP_SWIPE_THRESHOLD = 30; // matches the library's own default swipeDistance setting
    var bookPointerStart = null;
    function onBookPointerDown(e){
      if(!flipbookEl.contains(e.target)) return;
      var p = e.touches ? e.touches[0] : e;
      bookPointerStart = { x: p.clientX, y: p.clientY };
    }
    function onBookPointerUp(e){
      if(!bookPointerStart) return;
      var p = e.changedTouches ? e.changedTouches[0] : e;
      var moved = Math.hypot(p.clientX - bookPointerStart.x, p.clientY - bookPointerStart.y);
      bookPointerStart = null;
      if(moved < BOOK_TAP_SWIPE_THRESHOLD && pageFlip) pageFlip.userStop({ x: 0, y: 0 }, true);
    }
    window.addEventListener("mousedown", onBookPointerDown, true);
    window.addEventListener("touchstart", onBookPointerDown, true);
    window.addEventListener("mouseup", onBookPointerUp, true);
    window.addEventListener("touchend", onBookPointerUp, true);

    // build() fully tears the flipbook down and recreates it (the "fixed" sizing mode this
    // library uses can't resize itself live) -- rebuilding on every resize/orientationchange
    // meant rotating a phone blanked the screen for the length of that teardown, twice in a
    // row (the original code deliberately rebuilt a second time ~450ms later because mobile
    // browsers report stale viewport dimensions for a moment right after a rotation). Sizing
    // once at load and leaving it fixed for the rest of the session avoids that entirely. The
    // trade-off is a reader left open in one orientation/size won't reflow if the viewport
    // genuinely changes shape afterward (an actual desktop browser-window resize, say) -- a
    // reload picks up the new size, same as any other "fixed" page.

    // The link overlay is a different story, though: it's position:fixed and placed from a
    // getBoundingClientRect() snapshot taken only when the book's own "changeState" event fires
    // (see syncLinkOverlay above). On a phone, the browser's own address bar hiding/showing as
    // the page is touched shifts the visual viewport without the book ever flipping -- nothing
    // tells the overlay to re-measure, so its invisible hotspots can silently drift away from
    // the artwork they're supposed to sit on, making a tap land on the book underneath instead
    // (which the library may then read as the start of a swipe). Re-run just the lightweight
    // position sync (never a rebuild) on resize/orientation/scroll so the hotspots stay glued
    // to the page regardless of why the viewport moved.
    var resyncTimer = null;
    function scheduleOverlayResync(){
      if(resyncTimer) clearTimeout(resyncTimer);
      resyncTimer = setTimeout(function(){ resyncTimer = null; syncLinkOverlay(); }, 60);
    }
    window.addEventListener("resize", scheduleOverlayResync);
    window.addEventListener("orientationchange", scheduleOverlayResync);
    window.addEventListener("scroll", scheduleOverlayResync, { passive: true });
    if(window.visualViewport){
      window.visualViewport.addEventListener("resize", scheduleOverlayResync);
      window.visualViewport.addEventListener("scroll", scheduleOverlayResync);
    }
  }
})();
</script>
</body>
</html>
